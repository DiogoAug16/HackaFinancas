name: HackaFinancas

options:
  bundleIdPrefix: br.com.arthur
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  HackaFinancas:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Components
      - path: Models
      - path: Services
        excludes:
          - node-red
      - path: Utilities
      - path: Views
      - path: Assets.xcassets
      - path: assets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.hackatruck.hackafinancas
        PRODUCT_NAME: "Hacka Financas"
        PRODUCT_MODULE_NAME: HackaFinancas
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Hacka Financas"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

    scheme:
      testTargets:
        - HackaFinancasTests

  HackaFinancasTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: HackaFinancasTests

    dependencies:
      - target: HackaFinancas
